<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aveed Gorji — Hardware Designer & Systems Engineer portfolio featuring automotive, robotics, PC hardware, and aerospace engineering projects.">
  <title>Aveed Gorji — Hardware Designer & Systems Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Collapsible Header Bar (hidden at top, slides down upon scrolling past hero) -->
  <header class="masthead" id="masthead">
    <div class="container masthead-inner">
      <div class="brand">
        <a href="#top" class="brand-title">Aveed Gorji</a>
        <span class="brand-subtitle">Hardware Designer & Systems Engineer</span>
      </div>
      <nav class="nav-links" aria-label="Main Navigation">
        <a href="#projects" class="nav-link active">Projects</a>
        <a href="#top" class="nav-link">Top ↑</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <!-- Above-the-Fold Hero & Quick-Action Bar -->
    <section class="intro" id="hero" aria-labelledby="intro-headline">
      <div class="container">
        <div class="hero-name">Aveed Gorji</div>
        <h1 class="intro-title" id="intro-headline">
          Hardware Designer & Systems Engineer
        </h1>
        <p class="intro-desc">
          I love automotive, aerospace, robotics, and PC hardware.
        </p>

        <!-- Quick-Action Bar -->
        <div class="hero-actions">
          <a class="hero-btn" href="resume.pdf" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            <span>Resume</span>
          </a>
          <a class="hero-btn" href="https://linkedin.com/in/aveedg" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.65 1.65 0 1 0-.02-3.3 1.65 1.65 0 0 0 .02 3.3m1.39 9.74v-8.37H5.07v8.37h2.78z"/></svg>
            <span>LinkedIn</span>
          </a>
          <a class="hero-btn" href="https://github.com/aveedg" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
            <span>GitHub</span>
          </a>
          <button class="hero-btn" id="copy-email-btn" type="button" data-email="agorji@scu.edu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <span id="copy-email-text">Copy Email</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Projects Section -->
    <section class="projects-section" id="projects" aria-label="Selected Projects">
      <div class="container">
        <div class="section-header">
          <span class="section-title">Projects</span>
        </div>
        
        <!-- Dynamic Projects Container -->
        <div id="project-list" class="project-list"></div>
      </div>
    </section>
  </main>

  <!-- Interactive Lightbox Modal -->
  <dialog class="lightbox-dialog" id="lightbox" aria-modal="true" aria-label="Media Preview">
    <div class="lightbox-header">
      <div class="lightbox-titles">
        <span class="lightbox-proj-title" id="lightbox-proj-title">Project</span>
        <h2 class="lightbox-asset-title" id="lightbox-asset-title">Asset Title</h2>
      </div>
      <div class="lightbox-header-actions">
        <span class="lightbox-counter" id="lightbox-counter">1 / 1</span>
        <button class="lightbox-close" id="lightbox-close" aria-label="Close preview">×</button>
      </div>
    </div>
    <div class="lightbox-viewport" id="lightbox-viewport">
      <button class="lightbox-nav-btn lightbox-prev" id="lightbox-prev" aria-label="Previous image">‹</button>
      <img class="lightbox-img" id="lightbox-img" src="" alt="">
      <button class="lightbox-nav-btn lightbox-next" id="lightbox-next" aria-label="Next image">›</button>
    </div>
    <div class="lightbox-footer">
      <p class="lightbox-caption-text" id="lightbox-caption"></p>
      <div class="lightbox-footer-btns">
        <a class="lightbox-action-btn" id="lightbox-download-btn" href="" download>
          Download File ↓
        </a>
        <a class="lightbox-action-btn" id="lightbox-external-btn" href="" target="_blank" rel="noopener">
          Open Original ↗
        </a>
      </div>
    </div>
  </dialog>

  <!-- Scripts -->
  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
